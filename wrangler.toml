# Cloudflare Pages 配置
#
# 站点是纯静态的：site/ 目录里的文件就是全部产物，data.json 和 icons/ 由
# `node tools/site/build.mjs` 生成（零依赖，只用 Node 内置模块）。
#
# 两种部署方式：
#   1. 命令行：
#      node tools/site/build.mjs
#      npx wrangler pages deploy site --project-name=howtolivebetter
#   2. Git 集成：在 Cloudflare 控制台配置构建命令为 `node tools/site/build.mjs`，
#      输出目录为 `site`（Cloudflare Pages 的 wrangler.toml 暂不支持 [build] 字段）。
#
name = "howtolivebetter"
compatibility_date = "2026-10-13"
pages_build_output_dir = "site"

